spring:
  application:
    name: kafka-springboot
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # Don't put Java class names in headers - consumer decides the type itself
        spring.json.add.type.headers: false

    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer wraps the JSON deserializer so bad messages (poison pills) don't crash the consumer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.coffeeandcode.kafka_springboot.model.OrderEvent
        spring.json.trusted.packages: com.coffeeandcode.kafka_springboot.model

    listener:
      # 3 partitions -> 3 consumer threads
      concurrency: 3

  logging:
    level:
      org.apache.kafka: WARN